version: 2

models:
  - name: fct_recon_lines
    description: "One row per payment_id seen in the ledger, the statement, or both: exactly one match status judged against as_of_date, the date shift, the amount and integer fee checks, and one primary reason. SYNTHETIC."
    columns:
      - name: payment_id
        description: "PSP reference. Primary key. Taken from whichever side exists."
        data_tests:
          - unique
          - not_null
      - name: mid
        description: "Merchant account, from whichever side exists."
      - name: currency
        description: "Settlement currency. The same on both sides in v1.0."
      - name: has_ledger
        description: "The ledger has a capture for this payment."
      - name: has_statement
        description: "A SALE statement line exists for this payment."
      - name: event_id
        description: "Ledger side. NULL without a ledger side."
      - name: copies_received
        description: "Ledger side: deliveries received for the capture event."
      - name: event_ts
        description: "Ledger side: capture time, UTC."
      - name: booking_date
        description: "Ledger side: our revenue day."
      - name: ledger_amount_minor
        description: "Ledger side: booked amount in minor units (INT64)."
      - name: expected_accounting_date
        description: "Ledger side: the day the MID's cut-off predicts the PSP will book the sale."
      - name: due_date
        description: "Ledger side: from this day on (inclusive) a ledger-only line is missing."
      - name: line_id
        description: "Statement side. NULL without a statement side."
      - name: statement_id
        description: "Statement side: the file."
      - name: captured_ts
        description: "Statement side: the PSP's capture time, UTC."
      - name: accounting_date
        description: "Statement side: the PSP's day for the sale."
      - name: statement_arrival_date
        description: "Statement side: the arrival day of the statement file."
      - name: statement_gross_minor
        description: "Statement side: gross in minor units (INT64)."
      - name: statement_fee_minor
        description: "Statement side: fee charged in minor units (INT64)."
      - name: statement_net_minor
        description: "Statement side: net in minor units (INT64)."
      - name: recon_date
        description: "The line's own day: COALESCE(booking_date, DATE(captured_ts)). Never NULL. Partition column."
        data_tests:
          - not_null
      - name: scope_start
        description: "From stg_recon__as_of: the oldest loaded arrival day."
      - name: as_of_date
        description: "From stg_recon__as_of. Every status is judged against it."
        data_tests:
          - not_null
      - name: match_status
        description: "Exactly one of matched, before_scope, in_transit, missing_in_statement, missing_in_ledger."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["matched", "before_scope", "in_transit", "missing_in_statement", "missing_in_ledger"]
      - name: date_shift
        description: "Matched lines: none, timing_cutoff or date_mismatch. NULL for one-sided lines."
      - name: amount_diff_minor
        description: "Matched lines: ledger amount minus statement gross. NULL otherwise."
      - name: is_amount_mismatch
        description: "Matched and amount_diff_minor != 0. The gross tolerance is exactly 0. Never NULL."
      - name: expected_fee_minor
        description: "Lines with a statement side: the contracted fee, DIV(gross * fee_bps + 5000, 10000) + fee_fixed_minor."
      - name: fee_tolerance_minor
        description: "Lines with a statement side: GREATEST(fee_tol_min_minor, DIV(gross * fee_tol_bps + 9999, 10000))."
      - name: fee_variance_minor
        description: "Lines with a statement side: charged fee minus expected fee."
      - name: is_fee_mismatch
        description: "ABS(fee_variance_minor) > fee_tolerance_minor. A variance equal to the tolerance is within it. Never NULL. Always false for before_scope lines."
      - name: primary_reason
        description: "One reason code per line, by the precedence in reason_codes."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('reason_codes')
                field: code
      - name: is_exception
        description: "Any exception cause applies. Never NULL."

  - name: fct_recon_daily
    description: "One row per MID, currency and day: booked gross vs statement gross, the gap split into dated reason components, and unexplained_minor, which must be 0. Payments SYNTHETIC; USD columns use REAL NBK rates."
    config:
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [mid, currency, recon_date]
    columns:
      - name: mid
        data_type: string
        description: "From the spine: every MID in mids.csv."
        constraints:
          - type: not_null
      - name: currency
        data_type: string
        description: "The MID's currency, from mids.csv."
        constraints:
          - type: not_null
      - name: recon_date
        data_type: date
        description: "Every day from the earliest to the latest date in the inputs. Our booking day for the ledger side, the PSP's accounting day for the statement side. Days with no activity show zeros. Partition column."
        constraints:
          - type: not_null
      - name: as_of_date
        data_type: date
        description: "From stg_recon__as_of."
        constraints:
          - type: not_null
      - name: ledger_line_count
        data_type: int64
        description: "Top-down: captures in int_ledger__captures with this booking_date."
      - name: statement_line_count
        data_type: int64
        description: "Top-down: SALE lines with this accounting_date."
      - name: ledger_gross_minor
        data_type: int64
        description: "Top-down: SUM(amount_minor) of int_ledger__captures by booking_date."
      - name: statement_gross_minor
        data_type: int64
        description: "Top-down: SUM(gross_minor) of SALE lines by accounting_date."
      - name: gap_minor
        data_type: int64
        description: "ledger_gross_minor - statement_gross_minor."
      - name: timing_cutoff_minor
        data_type: int64
        description: "Dated component from fct_recon_lines: matched lines whose shift the MID's cut-off explains, +L on the booking date and -L on the accounting date."
      - name: date_mismatch_minor
        data_type: int64
        description: "Dated component: matched lines on an unexplained other day, +L on the booking date and -L on the accounting date."
      - name: amount_mismatch_minor
        data_type: int64
        description: "Dated component: every matched line, L - S on the accounting date."
      - name: in_transit_minor
        data_type: int64
        description: "Dated component: ledger-only lines not yet due, +L on the booking date."
      - name: missing_in_statement_minor
        data_type: int64
        description: "Dated component: ledger-only lines past their due date, +L on the booking date."
      - name: missing_in_ledger_minor
        data_type: int64
        description: "Dated component: statement-only lines in scope, -S on the accounting date."
      - name: before_scope_minor
        data_type: int64
        description: "Dated component: one-sided lines dated before scope_start, +L on the booking date or -S on the accounting date."
      - name: unexplained_minor
        data_type: int64
        description: "gap_minor minus the sum of the seven dated components. Must be exactly 0; assert_recon_decomposition_closes fails otherwise."
        constraints:
          - type: not_null
      - name: statement_fee_minor
        data_type: int64
        description: "Top-down: SUM(fee_minor) of SALE lines by accounting_date. Fees never enter the gross identity."
      - name: statement_net_minor
        data_type: int64
        description: "Top-down: SUM(net_minor) of SALE lines by accounting_date."
      - name: expected_fee_minor
        data_type: int64
        description: "SUM(expected_fee_minor) of fct_recon_lines with a statement side, by accounting_date."
      - name: fee_variance_minor
        data_type: int64
        description: "SUM(fee_variance_minor) of the same lines."
      - name: units_per_usd
        data_type: numeric
        description: "Rate for recon_date and currency, from int_fx__usd_rates_daily. NULL before the first fetched rate. REAL."
      - name: fx_rate_date
        data_type: date
        description: "The rate's own date."
      - name: fx_carry_days
        data_type: int64
        description: "Days the rate was carried forward, a project convention, not NBK's official rate for that day."
      - name: ledger_gross_usd
        data_type: numeric
        description: "to_usd(ledger_gross_minor, minor_per_major, units_per_usd). Reporting only."
      - name: statement_gross_usd
        data_type: numeric
        description: "to_usd(statement_gross_minor, minor_per_major, units_per_usd). Reporting only."
      - name: gap_usd
        data_type: numeric
        description: "to_usd(gap_minor, ...), converted once from gap_minor, so it can differ by 0.01 from ledger_gross_usd - statement_gross_usd."
